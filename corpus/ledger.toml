# IXV-LM の学習データ台帳。本番に入れるデータは、すべてここに記録して人が承認する。
# 検査は .venv/bin/python corpus/check_ledger.py で行う。
#
# 本プロジェクトの方針は README の「データの方針」に書いた。中核は自社の文章で、著作権に問題のないものを加える。Claude の生成した文章は入れない。
#
# class   A 標準採用 / B 採用時に人が承認する。使わないものは [[excluded]] に書く
# status  候補 / 実験のみ（本番には未承認）/ 承認済み / 使用中
# redistribution  L1 学習・検索・再配布が可 / L2 再配布不可 / L3 検索提示も再配布も不可（LLM-jp-4 の分類）
# 空欄は未確認。分からないことを推測で埋めない。

[meta]
total_target_b = 100     # 学習トークンの目標（10億単位）
updated = "2026-11-07"

# 配分の初期案。実験に基づかないので、0.1B の実験で確定させる。単位は 10億トークン
[budget]
ja-edu = 28
ja-pdf = 8
ja-recent = 6
ja-wiki = 3
ja-public = 5
dev-code = 18
dev-issue = 6
dev-commit = 3
dev-ja-tech = 3
en-edu = 15
en-math = 3
own = 2     # 調査の初期案。書籍、社内の文章、YouTube の量を測ったあとで見直す
sft = 0     # 事前学習の外。会話の追加学習（SFT）に使うデータ

